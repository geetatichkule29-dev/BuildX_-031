<!-- Toast Notification Container -->
<div id="toast" class="toast-container toast-hidden" role="alert" aria-live="polite">
  
  <!-- Dynamic Color Icon Container -->
  <div id="toastIcon" class="toast-icon">
    <i data-lucide="bell"></i>
  </div>

  <!-- Message Body -->
  <div class="toast-content">
    <h4 id="toastTitle" class="toast-title">Notification</h4>
    <p id="toastMsg" class="toast-msg">Message details will appear here.</p>
  </div>

  <!-- Close Button -->
  <button onclick="hideToast()" class="toast-close-btn" aria-label="Close notification">
    <i data-lucide="x"></i>
  </button>

  <!-- Auto-Dismiss Progress Bar -->
  <div id="toastProgress" class="toast-progress"></div>
</div>
